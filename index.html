<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="碼錶">
  <meta name="description" content="1314 預設時間展示碼錶，手動停止及分圈記錄。">
  <link rel="manifest" href="manifest.webmanifest?v=6">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=apple-6">
  <title>碼錶</title>
</head>
<body>
  <main class="stopwatch" aria-label="1314 碼錶">
    <section class="face" aria-label="碼錶顯示">
      <div id="digital" class="digital"><span id="time">1314:52:00.00</span></div>
      <div id="analog" class="analog" hidden>
        <svg viewBox="0 0 320 320" aria-hidden="true">
          <defs><line id="tick" x1="160" y1="10" x2="160" y2="20"/><line id="minor-tick" x1="160" y1="10" x2="160" y2="15"/></defs>
          <g id="dial-ticks" stroke="#8e8e93" stroke-width="1"/>
          <g fill="#f5f5f7" text-anchor="middle" font-size="17" font-family="system-ui,sans-serif"><text x="160" y="47">60</text><text x="273" y="165">15</text><text x="160" y="285">30</text><text x="47" y="165">45</text></g>
          <line id="lap-hand" x1="160" y1="180" x2="160" y2="38" stroke="#0a84ff" stroke-width="2"/>
          <line id="second-hand" x1="160" y1="185" x2="160" y2="28" stroke="#ff9f0a" stroke-width="2"/>
          <circle cx="160" cy="160" r="5" fill="#ff9f0a"/>
        </svg>
        <span id="analog-time" class="analog-time">1314:52:00.00</span>
      </div>
    </section>
    <div class="controls">
      <button id="lap-reset" class="round secondary" disabled>分圈</button>
      <div class="pages" role="group" aria-label="顯示方式">
        <button class="page-dot selected" id="digital-dot" aria-label="數字碼錶" aria-pressed="true"></button>
        <button class="page-dot" id="analog-dot" aria-label="指針碼錶" aria-pressed="false"></button>
      </div>
      <button id="start-stop" class="round start">開始</button>
    </div>
    <section class="lap-area" aria-label="分圈記錄"><ol id="laps" aria-label="分圈記錄"></ol></section>
    <span id="status" class="sr-only" role="status">準備開始</span>
  </main>
  <nav class="bottom-tabs" aria-label="時鐘工具">
    <div class="bottom-item" aria-hidden="true"><span class="nav-icon nav-world"></span><span>世界時鐘</span></div>
    <div class="bottom-item" aria-hidden="true"><span class="nav-icon nav-alarm"></span><span>鬧鐘</span></div>
    <button id="stopwatch-tab" class="bottom-item active" type="button" aria-current="page"><span class="nav-icon nav-stopwatch" aria-hidden="true"></span><span>碼錶</span></button>
    <button id="timer-tab" class="bottom-item" type="button" aria-label="計時器：設定起始與停止時間" aria-haspopup="dialog"><span class="nav-icon nav-timer" aria-hidden="true"></span><span>計時器</span></button>
  </nav>
  <dialog id="preset-settings" aria-labelledby="settings-title" aria-describedby="settings-note">
    <form id="preset-form" novalidate>
      <header class="settings-header"><h1 id="settings-title">計時器設定</h1><button id="settings-cancel" class="close-settings" type="button" aria-label="關閉設定">×</button></header>
      <p id="settings-note">設定起始時間與停止後顯示的時間，按「停止」才結束。此設定用於預設時間展示。</p>
      <fieldset><legend>起始時間</legend><div class="time-fields">
        <label>小時<input id="start-hours" type="number" inputmode="numeric" min="0" max="999999" step="1" required></label>
        <label>分鐘<input id="start-minutes" type="number" inputmode="numeric" min="0" max="59" step="1" required></label>
        <label>秒<input id="start-seconds" type="number" inputmode="numeric" min="0" max="59" step="1" required></label>
        <label>百分秒<input id="start-centis" type="number" inputmode="numeric" min="0" max="99" step="1" required></label>
      </div><output id="start-preview" class="time-preview">1314:52:00.00</output></fieldset>
      <fieldset><legend>停止後顯示時間</legend><div class="time-fields">
        <label>小時<input id="finish-hours" type="number" inputmode="numeric" min="0" max="999999" step="1" required></label>
        <label>分鐘<input id="finish-minutes" type="number" inputmode="numeric" min="0" max="59" step="1" required></label>
        <label>秒<input id="finish-seconds" type="number" inputmode="numeric" min="0" max="59" step="1" required></label>
        <label>百分秒<input id="finish-centis" type="number" inputmode="numeric" min="0" max="99" step="1" required></label>
      </div><output id="finish-preview" class="time-preview">1314:52:12.31</output></fieldset>
      <p id="settings-error" role="alert" hidden></p>
      <p class="reset-note">儲存後會重置本次計時與分圈記錄。</p>
      <button id="settings-save" class="save-settings" type="submit">儲存並重置</button>
      <button id="settings-defaults" class="default-settings" type="button">還原預設值</button>
    </form>
  </dialog>
  <script src="app.js?v=apple-6" defer></script>
</body>
</html>
